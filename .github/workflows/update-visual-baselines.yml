name: Update visual baselines

# Screenshot baselines are owned by CI because rendering differs between
# machines. Create or update them after a deliberate visual change or when a
# screenshot test is added, then review the committed images in the pull request.
#
# Two ways to run this:
# * Add the `update-visual-baselines` label to a pull request. This works from
#   the pull request's branch, so it needs nothing on the default branch. The
#   label is removed when the run finishes so it can be added again.
# * Run it by hand from the Actions tab. GitHub only lists a manually triggered
#   workflow once this file is on the default branch.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Update baselines
    # Pull requests from forks cannot be pushed to
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'update-visual-baselines' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Regenerate baselines
        run: npx oscd test --update

      - name: Commit changed baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/screenshots/baseline
          if git diff --cached --quiet; then
            echo "Baselines are already up to date"
          else
            git commit -m "test: update visual baselines"
            git push
          fi

      - name: Remove the label so it can be added again
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit ${{ github.event.pull_request.number }} --remove-label update-visual-baselines
