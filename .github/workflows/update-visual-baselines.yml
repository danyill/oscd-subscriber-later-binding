name: Update visual baselines

# Screenshot baselines are owned by CI because rendering differs between
# machines. Run this workflow, choosing the branch, to create or update them
# after a deliberate visual change or when a screenshot test is added. Review the
# committed images in the pull request.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Update baselines
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Regenerate baselines
        run: npx oscd test --update

      - name: Commit changed baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/screenshots/baseline
          if git diff --cached --quiet; then
            echo "Baselines are already up to date"
          else
            git commit -m "test: update visual baselines"
            git push
          fi
