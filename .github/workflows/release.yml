name: Release

# Automated releases with release-please. Pushing Conventional-Commit changes
# to main maintains a "release PR" that bumps the version and updates the
# changelog. Merging that PR tags the release (vX.Y.Z), creates the GitHub
# Release, and — via the gated job below — publishes to npm with Trusted
# Publishing (OIDC), no stored token.
#
# Trusted publisher to configure once, keyed to THIS workflow file:
#   * npm: repo + workflow `release.yml`
# npm requires the package to already exist before a trusted publisher can be
# configured, so publish the first version (0.8.0) by hand once, then configure
# the trusted publisher for later releases.

on:
  push:
    branches:
      - main

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Uses the default GITHUB_TOKEN. Swap for a PAT/App token if the test
          # workflows need to run on the release PR (GITHUB_TOKEN does not
          # trigger other workflows).
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  npm-publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build the package
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
