name: Test
on:
  push:
  pull_request:

jobs:
  unit:
    name: Lint and unit tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run unit tests with coverage
        run: npm test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov-report
          retention-days: 7
          if-no-files-found: ignore

  # Screenshot tests run for pull requests only. A missing baseline fails the
  # run. Baselines are owned by CI and are not updated locally.
  visual:
    name: Visual regression tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run visual regression tests
        run: npm run test:visual

      - name: Explain how to fix visual test failures
        if: failure()
        run: |
          echo "::error::Visual tests failed. If baselines are missing or the change is intended, run the 'Update visual baselines' workflow on this branch and review the committed images."

      - name: Create visual test failures artifact
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-test-failures
          path: test/screenshots/failed
          retention-days: 1
          if-no-files-found: ignore
