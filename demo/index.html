<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>oscd-subscriber-later-binding Demo</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300&family=Roboto:wght@300;400;500&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        background: white;
      }
    </style>
  </head>
  <body>
    <oscd-shell></oscd-shell>

    <script type="module">
      import '@omicronenergy/oscd-shell/oscd-shell.js';

      // bundled, the plugin is next to the demo folder; served from source it
      // is built into dist/
      const bundled = new URL(
        '../oscd-subscriber-later-binding.js',
        window.location.href
      ).href;
      const isBundled = (await fetch(bundled, { method: 'HEAD' })).ok;
      const pluginSrc = isBundled
        ? bundled
        : new URL('/dist/oscd-subscriber-later-binding.js', window.location.href)
            .href;

      const shell = document.querySelector('oscd-shell');
      shell.plugins = {
        menu: [
          {
            name: 'Open File',
            translations: { de: 'Datei öffnen' },
            icon: 'folder_open',
            src: 'https://cdn.jsdelivr.net/npm/@omicronenergy/oscd-menu-open@0.0.6/dist/oscd-menu-open.js'
          },
          {
            name: 'Save File',
            translations: { de: 'Datei speichern' },
            icon: 'save',
            src: 'https://cdn.jsdelivr.net/npm/@omicronenergy/oscd-menu-save@0.0.2/dist/oscd-menu-save.js'
          }
        ],
        editor: [
          {
            name: 'Subscriber Later Binding',
            translations: {
              de: 'Späte Bindung des Abonnenten',
              pt: 'Associação Tardia de Assinante'
            },
            icon: 'link',
            requireDoc: true,
            src: pluginSrc
          }
        ]
      };

      const params = new URL(document.location.href).searchParams;
      for (const [name, value] of params) {
        shell.setAttribute(name, value);
      }
    </script>
  </body>
</html>
