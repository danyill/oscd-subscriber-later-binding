<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>oscd-editor-subscriber-later-binding Demo</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300&family=Roboto:wght@300;400;500&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Material+Symbols+Outlined&display=block"
    />
    <style>
      * {
        --oscd-theme-text-font: 'Roboto';
        --oscd-theme-icon-font: 'Material Symbols Outlined';

        margin: 0px;
        padding: 0px;
      }

      oscd-shell {
        display: block;
        height: 100vh;
      }

      body {
        background: white;
      }
    </style>
  </head>
  <body>
    <oscd-shell></oscd-shell>

    <script type="module">
      // scoped registries must be polyfilled before any element is defined
      import '@webcomponents/scoped-custom-element-registry';
      import '@omicronenergy/oscd-shell/oscd-shell.js';
      import { definePlugins, plugins } from './plugins.js';

      const shell = document.querySelector('oscd-shell');
      definePlugins(shell.registry);
      shell.plugins = plugins;

      const params = new URL(document.location.href).searchParams;
      for (const [name, value] of params) {
        shell.setAttribute(name, value);
      }

      const sample = await fetch('sample.scd').then(r => r.text());
      shell.docs = {
        'sample.scd': new DOMParser().parseFromString(sample, 'application/xml')
      };
      shell.docName = 'sample.scd';
    </script>
  </body>
</html>
